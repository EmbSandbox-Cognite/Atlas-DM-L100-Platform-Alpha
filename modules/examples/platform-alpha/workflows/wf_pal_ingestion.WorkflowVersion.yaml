workflowExternalId: {{ workflow }}
version: 'v1'
workflowDefinition:
  tasks:
    - externalId: tr_pal_a_asset_classes
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_asset_classes
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_a_equipment_types
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_equipment_types
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_a_fl
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_fl
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_a_pumps
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_pumps
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_a_lube
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_lube
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_a_notifications
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_notifications
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_a_orders
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_orders
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_a_documents
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_documents
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_a_timeseries
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_a_timeseries
          concurrencyPolicy: fail
      onFailure: abortWorkflow
    - externalId: tr_pal_b_fl_parent
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_b_fl_parent
          concurrencyPolicy: fail
      onFailure: abortWorkflow
      dependsOn:
        - externalId: tr_pal_a_fl
    - externalId: tr_pal_b_fl_assetclass
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_b_fl_assetclass
          concurrencyPolicy: fail
      onFailure: abortWorkflow
      dependsOn:
        - externalId: tr_pal_a_fl
