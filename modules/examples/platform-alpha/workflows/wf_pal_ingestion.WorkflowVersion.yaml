        - externalId: tr_pal_a_lube
        - externalId: tr_pal_a_notifications
    - externalId: tr_pal_b_mo_notification
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_b_mo_notification
          concurrencyPolicy: fail
      onFailure: abortWorkflow
      dependsOn:
        - externalId: tr_pal_a_orders
        - externalId: tr_pal_a_notifications
    - externalId: tr_pal_b_mo_equipment
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_b_mo_equipment
          concurrencyPolicy: fail
      onFailure: abortWorkflow
      dependsOn:
