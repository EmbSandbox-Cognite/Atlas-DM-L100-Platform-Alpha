        - externalId: tr_pal_a_pumps
        - externalId: tr_pal_a_lube
    - externalId: tr_pal_b_doc_equipment
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_b_doc_equipment
          concurrencyPolicy: fail
      onFailure: abortWorkflow
      dependsOn:
        - externalId: tr_pal_a_documents
        - externalId: tr_pal_a_pumps
        - externalId: tr_pal_a_lube
    - externalId: tr_pal_b_ts_equipment
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_b_ts_equipment
          concurrencyPolicy: fail
      onFailure: abortWorkflow
