          externalId: tr_pal_b_served_by
          concurrencyPolicy: fail
      onFailure: abortWorkflow
      dependsOn:
        - externalId: tr_pal_a_pumps
        - externalId: tr_pal_a_lube
    - externalId: tr_pal_b_pump_served_by
      type: transformation
      parameters:
        transformation:
          externalId: tr_pal_b_pump_served_by
          concurrencyPolicy: fail
      onFailure: abortWorkflow
      dependsOn:
        - externalId: tr_pal_a_pumps
        - externalId: tr_pal_a_lube
    - externalId: fn_pal_ts_generator_run
      type: "function"
      parameters:
        function:
          externalId: fn_pal_ts_generator
          data: {}
        isAsyncComplete: false
      name: Generate Platform Alpha time series datapoints
      onFailure: abortWorkflow
      dependsOn:
        - externalId: tr_pal_b_fl_parent
        - externalId: tr_pal_b_fl_assetclass
        - externalId: tr_pal_b_pump_asset
        - externalId: tr_pal_b_lube_asset
        - externalId: tr_pal_b_notif_equipment
        - externalId: tr_pal_b_mo_notification
        - externalId: tr_pal_b_mo_equipment
        - externalId: tr_pal_b_doc_equipment
        - externalId: tr_pal_b_ts_equipment
        - externalId: tr_pal_b_served_by
        - externalId: tr_pal_b_pump_served_by
