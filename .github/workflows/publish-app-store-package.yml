            REACT_APPS="${REACT_APPS}${app_dir}\n"
            echo "${app_dir}|${app_name}" >> react_apps_map.txt
            fi
          done < <(find "${SOURCE_DIR}" -name "package.json" -type f -exec dirname {} \; 2>/dev/null | sort -u)
          
