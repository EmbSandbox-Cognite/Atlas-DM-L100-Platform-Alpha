              fi
            done < react_apps.txt
          else
            echo "ℹ️ No React apps to include"
          fi
          
          ZIP_SIZE_MB=$(du -m "${ZIP_NAME}" | cut -f1)
          echo "✅ Created ${ZIP_NAME} (${ZIP_SIZE_MB} MB)"
      
      - name: Upload to CDF
        env:
          CDF_PROJECT: ${{ vars.CDF_PROJECT }}
          CDF_CLUSTER: ${{ vars.CDF_CLUSTER }}
          CDF_URL: ${{ vars.CDF_URL }}
          IDP_CLIENT_ID: ${{ vars.IDP_CLIENT_ID }}
          IDP_CLIENT_SECRET: ${{ secrets.IDP_CLIENT_SECRET }}
          IDP_TENANT_ID: ${{ vars.IDP_TENANT_ID }}
          IDP_TOKEN_URL: ${{ vars.IDP_TOKEN_URL }}
        run: |
          python << 'PYTHON_SCRIPT'
          import os, sys, glob
          from cognite.client import CogniteClient
          from cognite.client.config import ClientConfig
          from cognite.client.credentials import OAuthClientCredentials
          from cognite.client.data_classes.data_modeling import NodeId
          
          cdf_project = os.getenv("CDF_PROJECT")
          cdf_url = os.getenv("CDF_URL")
          client_id = os.getenv("IDP_CLIENT_ID")
          client_secret = os.getenv("IDP_CLIENT_SECRET")
          token_url = os.getenv("IDP_TOKEN_URL")
          
          if not all([cdf_project, cdf_url, client_id, client_secret, token_url]):
              print("❌ Missing CDF credentials in GitHub environment")
              sys.exit(1)
          
          print(f"🔗 Connecting to {cdf_project}...")
          
          credentials = OAuthClientCredentials(
              token_url=token_url,
              client_id=client_id,
              client_secret=client_secret,
              scopes=[f"{cdf_url}/.default"]
          )
          
          client = CogniteClient(ClientConfig(
              client_name="GitHub-Action-Package-Publisher",
              project=cdf_project,
              base_url=cdf_url,
              credentials=credentials
          ))
          
          zip_file = glob.glob("*-*.zip")[0]  # Matches {repo}-{branch}.zip
          zip_filename = os.path.basename(zip_file)
          external_id = zip_filename.replace('.zip', '')
          package_base_name = zip_filename.replace('.zip', '')
          
          print(f"📦 Uploading {zip_filename}...")
          
          # Find and delete older versions with the same package base name
          print(f"🔍 Checking for older versions of {package_base_name}...")
          try:
              from cognite.client.data_classes.data_modeling import ViewId
              view_id = ViewId(space="cdf_cdm", external_id="CogniteFile", version="v1")
              instances = client.data_modeling.instances.list(
                  instance_type="node",
                  sources=[view_id],
                  space="app-packages",
                  limit=1000
              )
              
              packages_to_delete = []
              for instance in instances:
                  props = instance.properties or {}
                  file_props = props.get("cdf_cdm/CogniteFile/v1", {}) or props.get("CogniteFile/v1", {})
                  if isinstance(file_props, dict):
                      instance_name = file_props.get("name", instance.external_id)
                  else:
                      instance_name = instance.external_id
                  
                  instance_base_name = instance_name.replace('.zip', '')
                  if instance_base_name == package_base_name and instance.external_id != external_id:
                      packages_to_delete.append((instance.external_id, instance_name))
              
              if packages_to_delete:
                  print(f"🗑️  Found {len(packages_to_delete)} older version(s) to delete:")
                  for old_external_id, old_name in packages_to_delete:
                      print(f"   • {old_name} (externalId: {old_external_id})")
                      try:
                          client.files.delete(external_ids=[old_external_id])
                          print(f"   ✅ Deleted file: {old_name}")
                      except Exception as e:
                          print(f"   ⚠️  Could not delete file {old_name}: {e}")
                      try:
                          client.data_modeling.instances.delete(
                              instance_type="node",
                              space="app-packages",
                              external_id=old_external_id
                          )
                          print(f"   ✅ Deleted instance: {old_external_id}")
                      except Exception as e:
                          print(f"   ⚠️  Could not delete instance {old_external_id}: {e}")
              else:
                  print(f"✅ No older versions found")
          except Exception as e:
              print(f"⚠️  Could not check for older versions: {e}")
              print(f"   Continuing with upload anyway...")
          
          # Upload new version
          client.data_modeling.instances.apply(nodes=[{
              "instanceType": "node",
              "space": "app-packages",
              "externalId": external_id,
              "sources": [{
                  "source": {"type": "view", "space": "cdf_cdm", "externalId": "CogniteFile", "version": "v1"},
                  "properties": {"name": zip_filename, "mimeType": "application/zip"}
              }]
          }])
          
          client.files.upload_content(
              path=zip_file,
              instance_id=NodeId(space="app-packages", external_id=external_id)
          )
          
          print(f"✅ Published to {cdf_project}: {zip_filename}")
          PYTHON_SCRIPT

  # ==========================================================================
  # 🔧 MANUAL TRIGGER: Publish to specified environment
